<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Panorama Viewer</title>
<style>
  html,body { margin:0; padding:0; overflow:hidden; background:#000; height:100%;
              font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:#eee; }
  #info, #help { position:absolute; padding:6px 10px; background:rgba(0,0,0,.55);
                 border-radius:4px; font-size:13px; pointer-events:none;
                 white-space:nowrap; max-width:90vw; overflow:hidden;
                 text-overflow:ellipsis; }
  #info { top:10px; left:10px; }
  #help { bottom:10px; left:10px; font-size:12px; opacity:.85; }
  #nav { position:absolute; top:10px; right:10px; display:flex; gap:6px; }
  #nav button { background:#222; color:#eee; border:1px solid #444;
                padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  #nav button:hover { background:#333; }
  #nav button:disabled { opacity:.4; cursor:not-allowed; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="info">loading…</div>
<div id="nav">
  <button id="prev">◀ Prev</button>
  <button id="next">Next ▶</button>
  <button id="reset">⟳ Reset</button>
</div>
<div id="help">Drag: look around · Wheel: zoom · ←/→: prev/next · R: reset view</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}}
</script>

<script type="module">
import * as THREE from 'three';

// 配置从 URL hash 读：{"images": ["a.jpg", "b.jpg", ...]}
let cfg = {};
try { cfg = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}'); } catch (e) {}
const images = cfg.images || [];
let idx = 0;

const info = document.getElementById('info');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

// === 场景 ===
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1100);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 内表面 sphere：把法线翻转，贴图就贴在里侧
const geom = new THREE.SphereGeometry(500, 96, 64);
geom.scale(-1, 1, 1);
const material = new THREE.MeshBasicMaterial({color: 0x111111});
const sphere = new THREE.Mesh(geom, material);
scene.add(sphere);

// === 鼠标拖动看四周（经典 lon/lat 球面相机）===
let lon = 0, lat = 0;
let isDown = false, dx = 0, dy = 0, downLon = 0, downLat = 0;

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (e) => {
  isDown = true; dx = e.clientX; dy = e.clientY;
  downLon = lon; downLat = lat;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',   (e) => { isDown = false; canvas.releasePointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!isDown) return;
  // 拖动方向 = 视角反向（推动场景的感觉）
  lon = downLon - (e.clientX - dx) * 0.15;
  lat = Math.max(-85, Math.min(85, downLat + (e.clientY - dy) * 0.15));
});

window.addEventListener('wheel', (e) => {
  e.preventDefault();
  camera.fov = Math.min(110, Math.max(20, camera.fov + e.deltaY * 0.05));
  camera.updateProjectionMatrix();
}, {passive: false});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === 加载贴图 ===
const loader = new THREE.TextureLoader();
function loadIdx(i) {
  if (!images.length) { info.textContent = 'no images'; return; }
  idx = (i + images.length) % images.length;
  // 强制 server 根的绝对路径，避免相对到 viewer html 所在的子目录
  const raw = images[idx];
  const url = raw.startsWith('/') || /^https?:/.test(raw) ? raw : '/' + raw;
  info.textContent = `loading [${idx + 1}/${images.length}] ${raw}`;
  prevBtn.disabled = nextBtn.disabled = true;
  loader.load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    const old = sphere.material;
    sphere.material = new THREE.MeshBasicMaterial({map: tex});
    old?.dispose?.();
    info.textContent = `[${idx + 1}/${images.length}] ${raw}`;
    prevBtn.disabled = nextBtn.disabled = images.length < 2;
  }, undefined, (err) => {
    info.textContent = `load failed: ${raw}`;
    prevBtn.disabled = nextBtn.disabled = images.length < 2;
    console.error(err);
  });
}

prevBtn.onclick = () => loadIdx(idx - 1);
nextBtn.onclick = () => loadIdx(idx + 1);
document.getElementById('reset').onclick = () => {
  camera.fov = 75; camera.updateProjectionMatrix();
  lon = 0; lat = 0;
};
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  loadIdx(idx - 1);
  else if (e.key === 'ArrowRight') loadIdx(idx + 1);
  else if (e.key === 'r' || e.key === 'R') document.getElementById('reset').click();
});

// === 渲染循环 ===
function animate() {
  requestAnimationFrame(animate);
  const phi   = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  const tx = 500 * Math.sin(phi) * Math.cos(theta);
  const ty = 500 * Math.cos(phi);
  const tz = 500 * Math.sin(phi) * Math.sin(theta);
  camera.lookAt(tx, ty, tz);
  renderer.render(scene, camera);
}
animate();
loadIdx(0);
</script>
</body>
</html>
